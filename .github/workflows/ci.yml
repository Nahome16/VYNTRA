name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Compile
        run: python -m compileall -q backend/app backend/scripts backend/tests
      - name: Tests (SQLite)
        run: python -m pytest backend/tests

  backend-postgres:
    # Reproduce un despliegue sobre una base existente: arranca la version
    # anterior para crear el esquema viejo y luego la actual, que debe migrar,
    # crear indices y responder /health/ready (dos veces, para probar reinicios).
    name: Backend upgrade smoke (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vyntra
          POSTGRES_PASSWORD: vyntra
          POSTGRES_DB: vyntra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vyntra" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vyntra:vyntra@localhost:5432/vyntra
      ENVIRONMENT: production
      ALLOW_BOOTSTRAP: "false"
      STORAGE_DIR: /tmp/vyntra/evidence
      DOWNLOADS_DIR: /tmp/vyntra/downloads
      PREVIOUS_RELEASE: ee6cefe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          git show "$PREVIOUS_RELEASE:backend/requirements.txt" > /tmp/previous-requirements.txt
          pip install -r /tmp/previous-requirements.txt
          mkdir -p "$STORAGE_DIR" "$DOWNLOADS_DIR"
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
      - name: Start previous release to create the old schema
        run: |
          git worktree add /tmp/previous "$PREVIOUS_RELEASE"
          cd /tmp/previous/backend
          uvicorn app.main:app --port 8001 > /tmp/previous.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8001/health && break; sleep 2; done
          curl -fs localhost:8001/health || { cat /tmp/previous.log; exit 1; }
          kill %1
      - name: Start current version on the old schema (twice)
        working-directory: backend
        run: |
          for run in 1 2; do
            uvicorn app.main:app --port 8000 > /tmp/current-$run.log 2>&1 &
            ok=""
            for i in $(seq 1 60); do
              if curl -fs localhost:8000/health/ready; then ok=1; break; fi
              sleep 2
            done
            echo
            cat /tmp/current-$run.log
            [ -n "$ok" ] || exit 1
            curl -fs localhost:8000/api/health/ready
            kill %1; wait || true
          done
      - name: Verify indexes and new tables
        run: |
          python - <<'EOF'
          import psycopg
          with psycopg.connect("postgresql://vyntra:vyntra@localhost:5432/vyntra") as conn:
              indexes = conn.execute("select count(*) from pg_indexes where schemaname='public'").fetchone()[0]
              receipts = conn.execute("select to_regclass('public.agent_event_receipts')").fetchone()[0]
              print("indexes:", indexes, "| agent_event_receipts:", receipts)
              assert receipts, "falta la tabla agent_event_receipts"
          EOF

  web:
    name: Web (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  agent:
    name: Desktop agent (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile root agent modules
        run: python -m compileall -q -l .
