[Server]
Url = https://api.vyntralab.com

[Agent]
Version = 1.2.3

[AgentUpdate]
Enabled = true

[Interface]
Language = es

[Capture]
IntervalSeconds = 300
Directory = capturas

[General]
Empresa = Nombre de la Empresa
CorreoContacto = rrhh@empresa.com

[Telemetria]
IdleUmbralSegundos = 60

[Update]
; Huella (SHA-1) del certificado de code signing de VYNTRAAgent.exe. Si se
; configura, las actualizaciones exigen firma Authenticode valida de ese
; firmante (varias huellas separadas por coma para rotar certificados).
; Vacio = se acepta el paquete verificado solo por SHA-256 (con advertencia).
SignerThumbprint =

[EvidenceBackend]
Enabled = true
Url = https://api.vyntralab.com
; Se cifra con DPAPI al primer inicio (DeviceTokenProtected).
DeviceToken =
RetryLimit = 50
RequestTimeoutSeconds = 30
QueueDatabase =
DeleteAfterUpload = true

[StationAuth]
AllowLocalFallback = false
