[Server]
Url = http://localhost:8000

[Agent]
Version = 1.0.0

[Capture]
IntervalSeconds = 300
Directory = capturas

[General]
Empresa = Tu Empresa S.A.
CorreoContacto = rrhh@tuempresa.com

[Telemetria]
IdleUmbralSegundos = 60

[Admin]
; PIN provisional para restaurar marcajes hechos por error.
; En produccion esta autorizacion debe venir desde la plataforma web.
PIN = CAMBIAR_ESTE_PIN

[GoogleDrive]
Enabled = false
FolderId =
CredentialsJson =

[EvidenceBackend]
; Produccion: activar cuando el backend este publicado.
Enabled = true
Url = http://localhost:8000
DeviceToken = CAMBIAR_TOKEN_UNICO_DEL_EQUIPO
RetryLimit = 50
RequestTimeoutSeconds = 30
QueueDatabase =

[StationAuth]
; Solo usar fallback local cuando no haya backend configurado para desarrollo.
AllowLocalFallback = false
